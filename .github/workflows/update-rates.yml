name: Update AIA Exchange Rates

# 每日自動抓取 AIA 官方匯率，寫入 data/rates.js 並推回倉庫。
# 這是匯率資料的主力來源；Cloudflare Worker 只是即時刷新的補充。
# 兩套並存：任一邊失效，網站都還有資料可用。

on:
  schedule:
    # UTC 00:00 = 香港時間 08:00
    # 注意：GitHub 不定時延遲，實際可能在 08:05–08:30 之間，偶爾跳過一次。
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許在 Actions 分頁手動觸發

# 同一時間只跑一個：避免排程與手動觸發互相搶 push
# （基金、Dah Sing 兩個工作流早就有，只有匯率漏了）
concurrency:
  group: update-rates-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 少了這段推不上去

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # v4 用的是 Node 20，已被 GitHub 標記棄用，runner 會強制丟到 Node 24 並噴警告。
      # v5 起改用 node24，警告消失。（v6 / v7 也是 node24，但 v5 是 v4 的直接後繼、最穩。）
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 讓後面的 git pull --rebase 能正常運作

      # ① 先跟遠端同步，而且必須在「動到任何檔案之前」做。
      #    舊版是先寫 data/rates.js 再 pull，檔案一髒 Git 就拒絕：
      #    error: cannot pull with rebase: You have unstaged changes.
      - name: Sync with remote
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }}

      # ② 抓 AIA，先落到暫存檔，還不碰倉庫裡的 data/rates.js
      - name: Fetch rates from AIA
        run: |
          curl -sS --fail --max-time 30 \
            "https://www1.aia.com.hk/CorpWS/Investment/Get/ExchangeRate2" \
            -o /tmp/aia.json

          # 抓到空檔就中止，保留昨天的資料，不要寫壞檔案
          if [ ! -s /tmp/aia.json ]; then
            echo "::error::抓取結果為空，保留既有資料"
            exit 1
          fi

          # 轉成 .js 而非 .json：這樣 file:// 本機直接開啟也能載入
          # （fetch() 讀 JSON 在 file 協定下會被 CORS 擋住）
          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync("/tmp/aia.json", "utf8"));
            if (!Array.isArray(raw) || raw.length < 2) { console.error("資料格式異常"); process.exit(1); }
            const asOf = (raw.find(r => r.type === "date") || {}).value || "";
            const rates = {};
            for (const r of raw) if (r.type !== "date") rates[r.type.toUpperCase()] = r.value;
            const payload = { asOf, fetchedAt: new Date().toISOString(), rates };
            fs.writeFileSync("/tmp/rates.new.js",
              "window.AIA_RATES = " + JSON.stringify(payload, null, 2) + ";\n");
            console.log("日期:", asOf, "幣種數:", Object.keys(rates).length);
          '

      # ③ 只比對 asOf + rates，忽略每次都變的 fetchedAt。
      #    否則光是時間戳不同就天天空 commit，把提交歷史洗滿。
      - name: Write only if rates changed
        run: |
          node -e '
            const fs = require("fs");
            const parse = (s) => {
              const m = String(s).match(/window\.AIA_RATES\s*=\s*([\s\S]*?);\s*$/);
              const o = JSON.parse(m[1]);
              return JSON.stringify([o.asOf, o.rates]);
            };
            const next = fs.readFileSync("/tmp/rates.new.js", "utf8");
            const cur = fs.existsSync("data/rates.js")
              ? fs.readFileSync("data/rates.js", "utf8") : null;
            if (cur && parse(cur) === parse(next)) {
              console.log("匯率與既有內容相同，略過寫入");
              process.exit(0);
            }
            fs.mkdirSync("data", { recursive: true });
            fs.copyFileSync("/tmp/rates.new.js", "data/rates.js");
            console.log("已更新 data/rates.js");
          '

      # ③b 把當天快照寫進時間序列 data/rates-history.js
      #     鍵用 AIA 的 asOf（資料日期），不是 commit 日 —— cron 延遲時兩者可能差一天。
      #     同日重跑會覆蓋、不會重複；值相同也不會觸發額外 commit。
      - name: Append to rates history
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("/tmp/rates.new.js", "utf8");
            const o = JSON.parse(src.match(/window\.AIA_RATES\s*=\s*([\s\S]*?);\s*$/)[1]);
            if (!o.asOf || !o.rates || !Object.keys(o.rates).length) {
              console.error("asOf / rates 異常"); process.exit(1);
            }
            require("child_process").execFileSync(
              process.execPath,
              ["scripts/append_history.js", "data/rates-history.js",
               "__RATES_HISTORY__", o.asOf, JSON.stringify(o.rates)],
              { stdio: "inherit" });
          '

      # ④ 有實際變動才提交
      - name: Commit only if changed
        run: |
          # ① 檔案必須存在：否則 git add 會報
          #    fatal: pathspec '...' did not match any files（exit 128）
          for f in data/rates.js data/rates-history.js; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少 $f，中止提交"
              exit 1
            fi
          done

          git add data/rates.js data/rates-history.js

          if git diff --quiet --cached; then
            echo "匯率未變動，略過提交"
            exit 0
          fi

          git commit -m "chore(rates): update $(date -u +%Y-%m-%d)"

          # ② 推送重試三次。
          #    2026-11-16 run #77 失敗於這一步，退出碼 128 —— git 的 fatal 級錯誤
          #    （認證抖動／連線被 reset／二級速率限制／index.lock／pathspec 不匹配），
          #    都是瞬時的，重試通常就能過。
          #    匯率是「當日快照」，AIA 只提供當日值 → 失敗一次就永久缺一天，
          #    不能像基金那樣靠隔天全量重抓自癒，所以必須在這裡自癒。
          for i in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "推送成功（第 $i 次）"
              exit 0
            else
              rc=$?
              echo "::warning::第 $i 次推送失敗（exit ${rc}），10 秒後重新同步再試"
            fi
            sleep 10
            # 先同步再加推。若 rebase 有衝突（代表有另一個流程同時改同一個檔），
            # 立即 abort 並告警 —— 這種情況重試解決不了，別浪費剩下兩次機會。
            # （已加 concurrency，正常情況下不該出現；出現即代表有異常。）
            if ! git pull --rebase origin ${{ github.ref_name }}; then
              git rebase --abort || true
              echo "::error::同步時發生衝突，放棄重試（請檢查是否有流程同時改 rates 檔）"
              exit 1
            fi
          done

          echo "::error::推送重試 3 次仍失敗，本日匯率未寫入"
          exit 1
