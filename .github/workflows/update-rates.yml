name: Update AIA Exchange Rates

# 每日自動抓取 AIA 官方匯率，寫入 data/rates.js 並推回倉庫。
# 這是匯率資料的主力來源；Cloudflare Worker 只是即時刷新的補充。
# 兩套並存：任一邊失效，網站都還有資料可用。

on:
  schedule:
    # UTC 00:00 = 香港時間 08:00
    # 注意：GitHub 不定時延遲，實際可能在 08:05–08:30 之間，偶爾跳過一次。
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許在 Actions 分頁手動觸發

permissions:
  contents: write # 少了這段推不上去

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # v4 用的是 Node 20，已被 GitHub 標記棄用，runner 會強制丟到 Node 24 並噴警告。
      # v5 起改用 node24，警告消失。（v6 / v7 也是 node24，但 v5 是 v4 的直接後繼、最穩。）
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 讓後面的 git pull --rebase 能正常運作

      # ① 先跟遠端同步，而且必須在「動到任何檔案之前」做。
      #    舊版是先寫 data/rates.js 再 pull，檔案一髒 Git 就拒絕：
      #    error: cannot pull with rebase: You have unstaged changes.
      - name: Sync with remote
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }}

      # ② 抓 AIA，先落到暫存檔，還不碰倉庫裡的 data/rates.js
      - name: Fetch rates from AIA
        run: |
          curl -sS --fail --max-time 30 \
            "https://www1.aia.com.hk/CorpWS/Investment/Get/ExchangeRate2" \
            -o /tmp/aia.json

          # 抓到空檔就中止，保留昨天的資料，不要寫壞檔案
          if [ ! -s /tmp/aia.json ]; then
            echo "::error::抓取結果為空，保留既有資料"
            exit 1
          fi

          # 轉成 .js 而非 .json：這樣 file:// 本機直接開啟也能載入
          # （fetch() 讀 JSON 在 file 協定下會被 CORS 擋住）
          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync("/tmp/aia.json", "utf8"));
            if (!Array.isArray(raw) || raw.length < 2) { console.error("資料格式異常"); process.exit(1); }
            const asOf = (raw.find(r => r.type === "date") || {}).value || "";
            const rates = {};
            for (const r of raw) if (r.type !== "date") rates[r.type.toUpperCase()] = r.value;
            const payload = { asOf, fetchedAt: new Date().toISOString(), rates };
            fs.writeFileSync("/tmp/rates.new.js",
              "window.AIA_RATES = " + JSON.stringify(payload, null, 2) + ";\n");
            console.log("日期:", asOf, "幣種數:", Object.keys(rates).length);
          '

      # ③ 只比對 asOf + rates，忽略每次都變的 fetchedAt。
      #    否則光是時間戳不同就天天空 commit，把提交歷史洗滿。
      - name: Write only if rates changed
        run: |
          node -e '
            const fs = require("fs");
            const parse = (s) => {
              const m = String(s).match(/window\.AIA_RATES\s*=\s*([\s\S]*?);\s*$/);
              const o = JSON.parse(m[1]);
              return JSON.stringify([o.asOf, o.rates]);
            };
            const next = fs.readFileSync("/tmp/rates.new.js", "utf8");
            const cur = fs.existsSync("data/rates.js")
              ? fs.readFileSync("data/rates.js", "utf8") : null;
            if (cur && parse(cur) === parse(next)) {
              console.log("匯率與既有內容相同，略過寫入");
              process.exit(0);
            }
            fs.mkdirSync("data", { recursive: true });
            fs.copyFileSync("/tmp/rates.new.js", "data/rates.js");
            console.log("已更新 data/rates.js");
          '

      # ④ 有實際變動才提交
      - name: Commit only if changed
        run: |
          git add data/rates.js

          if git diff --quiet --cached; then
            echo "匯率未變動，略過提交"
          else
            git commit -m "chore(rates): update $(date -u +%Y-%m-%d)"
            git push origin HEAD:${{ github.ref_name }}
          fi
