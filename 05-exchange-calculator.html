<script>
(function () {
  'use strict';
  var KEY = 'aia-hk-exchange-rates-v1';
  /* 部署 Cloudflare Worker 後，把網址填在 workerUrl（例：https://aia-rates.xxx.workers.dev）。
     留空則只用 GitHub Actions 每日寫入的 data/rates.js。 */
  window.__FX_CONFIG__ = { workerUrl: 'https://aia-rates.johnnyyuen-aia.workers.dev/rates', autoRefreshOnLoad: true };
  window.__FX_CUR__ = [["usd", "USD", "US Dollar", "美元"], ["aus", "AUD", "Australian Dollar", "澳元"], ["rmb", "CNY", "Renminbi", "人民幣"], ["can", "CAD", "Canadian Dollar", "加拿大元"], ["chf", "CHF", "Swiss Franc", "瑞士法郎"], ["pound", "GBP", "Pound Sterling", "英鎊"], ["peso", "PHP", "Peso", "披索"], ["mop", "MOP", "Macau MOP", "澳門幣"], ["nt", "TWD", "Taiwan New Dollar", "新台幣"], ["sing", "SGD", "Singapore Dollar", "新加坡元"], ["nzd", "NZD", "New Zealand Dollar", "紐西蘭元"], ["euro", "EUR", "Euro", "歐羅"], ["yen", "JPY", "Japanese Yen", "日圓"]];
  window.__FX_FB__ = [{type:"usd",value:"7.8511",name:{en:"US Dollar",zh:"美元"}},{type:"aus",value:"5.5306",name:{en:"Australian Dollar",zh:"澳元"}},{type:"rmb",value:"1.1665",name:{en:"Renminbi",zh:"人民幣"}},{type:"can",value:"5.6237",name:{en:"Canadian Dollar",zh:"加拿大元"}},{type:"chf",value:"9.6519",name:{en:"Swiss Franc",zh:"瑞士法郎"}},{type:"pound",value:"10.5794",name:{en:"Pound Sterling",zh:"英鎊"}},{type:"peso",value:"0.1279",name:{en:"Peso",zh:"披索"}},{type:"mop",value:"0.9704",name:{en:"Macau MOP",zh:"澳門幣"}},{type:"nt",value:"0.2439",name:{en:"Taiwan New Dollar",zh:"新台幣"}},{type:"sing",value:"6.1277",name:{en:"Singapore Dollar",zh:"新加坡元"}},{type:"nzd",value:"4.5780",name:{en:"New Zealand Dollar",zh:"紐西蘭元"}},{type:"euro",value:"9.0439",name:{en:"Euro",zh:"歐羅"}},{type:"yen",value:"0.0492",name:{en:"Japanese Yen",zh:"日圓"}}];

  function cur() { return window.__FX_CUR__ || []; }

  function fromAiaArray(list) {
    if (!Array.isArray(list) || !list.length) return null;
    var by = {}, date = '';
    for (var i = 0; i < list.length; i++) {
      var r = list[i]; if (!r) continue;
      if (r.type === 'date') { date = r.value || ''; continue; }
      by[r.type] = r.value;
    }
    var out = [];
    cur().forEach(function (c) {
      if (by[c[0]]) out.push({ type: c[0], value: String(by[c[0]]), name: { en: c[2], zh: c[3] } });
    });
    return out.length ? { rates: out, dataDate: date } : null;
  }

  function fromRatesJs() {
    var p = window.AIA_RATES;
    if (!p || !p.rates) return null;
    var out = [];
    cur().forEach(function (c) {
      var v = p.rates[c[0].toUpperCase()] || p.rates[c[1]];
      if (v) out.push({ type: c[0], value: String(v), name: { en: c[2], zh: c[3] } });
    });
    return out.length ? { rates: out, dataDate: p.asOf || '' } : null;
  }

  function readCache() {
    try {
      var s = localStorage.getItem(KEY); if (!s) return null;
      var o = JSON.parse(s);
      return (o && Array.isArray(o.rates) && o.rates.length) ? o : null;
    } catch (e) { return null; }
  }
  function writeCache(rates, dataDate) {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        rates: rates, dataDate: dataDate, cachedAt: new Date().toISOString()
      }));
    } catch (e) {}
  }

  /* 開頁時：若倉庫每日快照比本機快取新，靜默升級 */
  (function prime() {
    var js = fromRatesJs(); if (!js) return;
    var c = readCache();
    if (!c || (c.dataDate || '') !== (js.dataDate || '')) writeCache(js.rates, js.dataDate);
  })();

  window.__fxRefresh = async function () {
    var cfg = window.__FX_CONFIG__ || {};

    /* 1) Worker 即時 */
    if (cfg.workerUrl) {
      try {
        var r = await fetch(cfg.workerUrl, { cache: 'no-store' });
        if (r.ok) {
          var got = fromAiaArray(await r.json());
          if (got) {
            writeCache(got.rates, got.dataDate);
            return {
              ok: true, source: 'online', rates: got.rates, dataDate: got.dataDate,
              cachedAt: new Date().toISOString(),
              message: '已讀取 AIA 當日匯率 · ' + got.dataDate
            };
          }
        }
      } catch (e) {}
    }

    /* 2) Actions 每日快照 */
    var js = fromRatesJs();
    if (js) {
      writeCache(js.rates, js.dataDate);
      return {
        ok: true, source: 'online', rates: js.rates, dataDate: js.dataDate,
        cachedAt: new Date().toISOString(),
        message: '已讀取倉庫每日快照 · ' + js.dataDate
      };
    }

    /* 3) 本機快取 */
    var c = readCache();
    if (c) {
      return {
        ok: true, source: 'cache', rates: c.rates, dataDate: c.dataDate,
        cachedAt: c.cachedAt || '',
        message: '未能連線更新，現正使用本機上次成功讀取的數據 · ' + (c.dataDate || '')
      };
    }

    /* 4) 內建快照 */
    return {
      ok: false, source: 'fallback', rates: window.__FX_FB__, dataDate: '', cachedAt: '',
      message: '暫時未能讀取實時匯率，請稍後再試，或貼上 AIA 兌換率網頁內容。'
    };
  };

  /* 開頁自動刷新一次：僅在 GitHub Pages 生效（與工具內 Jw() 的判定一致）。
     做法是點工具自己的「重新讀取」按鈕，與手動點擊走完全相同的路徑，
     確保所有 state（匯率、日期、匯率日期欄、來源、訊息）一致。
     本地／其他網域不會觸發，避免打到 Manus 後端噴 404。 */
  (function autoRefreshOnce() {
    if (window.__FX_CONFIG__ && window.__FX_CONFIG__.autoRefreshOnLoad === false) return;
    if (!/\.github\.io$/.test(location.hostname)) return;

    var done = false;
    function findButton() {
      var btns = document.querySelectorAll('button');
      for (var i = 0; i < btns.length; i++) {
        var t = (btns[i].textContent || '').replace(/\s+/g, '');
        if (t.indexOf('重新讀取') >= 0 || t.indexOf('重新读取') >= 0) return btns[i];
      }
      return null;
    }

    /* 先探測一次：只有拿得到資料才點按鈕。
       拿不到就什麼都不做，維持工具原本的初始畫面，
       不會自動彈出「貼上資料」面板。 */
    function run() {
      if (done) return true;
      var btn = findButton();
      if (!btn) return false;
      done = true;
      window.__fxRefresh().then(function (res) {
        if (res && res.ok) btn.click();
      }).catch(function () {});
      return true;
    }

    // React 掛載時序不定，輪詢等按鈕出現；最多等 10 秒
    var tries = 0;
    var timer = setInterval(function () {
      if (run() || ++tries > 40) clearInterval(timer);
    }, 250);
  })();
})();
</script>

<script type="module">/* HUB_HOME_FIX — 讓「Go Home」/「返回工具目錄」回到正確的站台首頁。
   背景：網站搬到 /workspace/ 子路徑，但各頁 wouter Router 都是 base:""，
   NotFound 的導覽動作與返回連結寫死成根路徑，結果一律跳到網域根
   https://hkcyclops.github.io/ ，而不是 /workspace/ 。
   本函式依目前網址回傳站台根目錄：
     /workspace 或 /workspace/…  → /workspace/
     其它（舊的網域根部署）      → /
     file://                      → ./index.html（本機雙擊開啟）
   用 location.href 整頁跳轉，不走 SPA router：
