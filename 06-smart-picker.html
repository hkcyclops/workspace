<!doctype html>
<html lang="zh-Hant" data-picker="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智選基金 · Smart Picker（試用版）</title>
<style>
:root{
  --bg:#faf8f4; --card:#fffdf8; --ink:#2c2722; --ink-2:#453c34; --gray:#8d7c65; --line:#eadfce;
  --line-2:#ddcfba; --red:#8f0d25; --gold:#c8a85b; --lit-bg:#fdf3e3; --lit-ink:#8d641d;
  --up:#b13446; --down:#2f7a5a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 "Noto Sans TC",ui-sans-serif,system-ui,sans-serif}
a{color:var(--red)}
.wrap{max-width:1080px;margin:0 auto;padding:18px 14px 90px}
.masthead{border-bottom:2px solid var(--red);padding-bottom:10px;margin-bottom:12px}
.eyebrow{margin:0;font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--gray)}
h1{margin:4px 0 0;font-family:Georgia,"Noto Serif TC",serif;font-size:24px;font-weight:500}
.sub{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
.sub b{color:var(--ink)}
.stage{background:var(--card);border:1px solid #e5d5bd;border-radius:12px;overflow:hidden;
  box-shadow:inset 0 2px var(--gold);
  font:14px/1.5 "Noto Sans TC",ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:11px 13px;
  background:linear-gradient(135deg,#fffdf7f5,#f9f4ead1);border-bottom:0}
.stage.open .bar{border-bottom:1px solid #eadfce}
.toggle{appearance:none;border:0;background:0 0;font:inherit;font-weight:800;cursor:pointer;color:var(--ink);
  display:inline-flex;align-items:center;gap:7px;padding:2px 0;color:#7f1028}
.toggle .ic{width:15px;height:15px;flex:0 0 auto;display:block}
.toggle .caret{color:var(--red);font-size:11px}
.sums{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 180px;min-width:0}
.sum{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--lit-ink);white-space:nowrap;
  background:var(--lit-bg);padding:3px 7px;cursor:pointer;border:0}
.sum .x{color:var(--red);font-weight:800}
.hit{font-size:12px;font-weight:800;color:var(--red);white-space:nowrap}
.reset{appearance:none;background:0 0;border:1px solid var(--line-2);color:var(--gray);font:inherit;font-size:11.5px;
  padding:3px 8px;cursor:pointer}
.panel{padding:12px 12px 14px;contain:layout style}
.panel[hidden]{display:none}
/* ① 面板收合時，底部那一排（查看結果／收藏／我的收藏／加入組合／提示）也一起收 */
.panel[hidden]~.foot{display:none}
.presets{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.presets .lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--gray);margin-right:2px}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:2px 22px;margin-top:8px}
@media (max-width:768px){ .groups{grid-template-columns:1fr} }
.g{display:flex;align-items:flex-start;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line)}
.g>.gl{flex:0 0 74px;font-size:11.5px;font-weight:800;color:var(--ink-2);padding-top:3px}
.g>.gc{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.chip{appearance:none;border:0;background:0 0;font:inherit;font-size:12.5px;color:var(--gray);
  cursor:pointer;padding:2px 1px;line-height:1.35}
.chip:hover{color:var(--red)}
.chip.on{color:var(--lit-ink);background:var(--lit-bg);font-weight:700}
.chip.na{color:var(--line-2);cursor:default}
.pop{appearance:none;border:0;background:0 0;font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer;
  padding:2px 1px;display:inline-flex;align-items:center;gap:4px}
.pop:hover{color:var(--red)}
.pop .v{font-family:ui-monospace,Consolas,monospace;font-weight:700}
.pop.on{color:var(--lit-ink);background:var(--lit-bg);font-weight:700}
.pop .caret{font-size:9px;color:var(--gray)}
.pane{position:fixed;z-index:60;background:#fff;border:1px solid var(--line-2);box-shadow:0 10px 28px rgba(30,20,10,.16);
  padding:10px;min-width:200px}
.pane[hidden]{display:none}
.pane h4{margin:0 0 6px;font-size:11px;color:var(--gray);letter-spacing:.06em}
.pane label{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:3px 2px;cursor:pointer}
.pane input[type=search],.pane input[type=number]{width:66px;min-height:26px;font:inherit;font-size:12.5px;padding:0 6px;
  background:#fffdf8;border:1px solid var(--line-2);color:var(--ink)}
.pane input[type=search]{width:100%;margin-bottom:6px}
.pane .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pane .scrl{max-height:190px;overflow:auto;margin-top:2px}
.pane .pRow{gap:4px}
.pane .plab{flex:0 0 62px;color:var(--ink-2);font-weight:700;font-size:12px}
.pane .sig{color:var(--gray);font-size:11px}
.pane .u{color:var(--gray);font-size:11px;margin-left:2px}
.pane .fav{justify-content:space-between}
.pane .favname{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.pane .favname em{display:block;font-style:normal;font-weight:400;color:var(--gray);font-size:10.5px}
.pane .acts{display:flex;gap:6px;margin-top:8px}
.pane .acts button{flex:1;appearance:none;font:inherit;font-size:12px;font-weight:700;padding:5px 0;cursor:pointer;
  background:#fffdf8;border:1px solid var(--line-2);color:var(--ink-2)}
.pane .acts button.k{background:var(--red);border-color:var(--red);color:#fff7ee}
.hint{font-size:10.5px;color:var(--gray)}
.foot{padding:9px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;font:inherit;font-size:12.5px;font-weight:700;padding:6px 12px;cursor:pointer;
  background:#fffdf8;border:1px solid var(--line-2);color:var(--ink-2);
  display:inline-flex;align-items:center;justify-content:center;gap:5px;line-height:1.35}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.k{background:var(--red);border-color:var(--red);color:#fff7ee}
.btn.gold{border-color:var(--gold);color:var(--lit-ink)}
.btn .ic{width:13px;height:13px;vertical-align:0;margin-right:0;display:block;flex:0 0 auto}
.btn.k .ic{color:#fff7ee}
.res{margin-top:14px;contain:content}
table{width:100%;border-collapse:collapse;font-size:11px}
#tbl{table-layout:fixed}
#tbl th,#tbl td{overflow:hidden;text-overflow:ellipsis}
#tbl tbody td{font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em}
th,td{padding:8px 5px;border-bottom:1px solid #eee3d4;text-align:right;white-space:nowrap;line-height:1.22}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
th{font:inherit;font-size:10px;font-weight:800;color:#49372f;background:#f0e8dc;
  border-bottom:1px solid #d8c8b3;cursor:pointer;user-select:none}
th:hover{color:var(--red)}
td.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:#3e332c}
td.cell-code{line-height:1.25}
.sub{display:block;font-size:10px;line-height:1.25;color:#9c907f;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td .nm{display:block;line-height:1.3}
.sub.stars{color:var(--gold);font-size:10.5px;letter-spacing:.5px}
tbody tr.drow{cursor:pointer}
tbody tr.drow.alt td{background:#fffaf2}
tbody tr.drow:hover td{background:#f3e3cc}
tr.drow td{vertical-align:top}
tr.xrow td{background:#fdfaf3;border-bottom:2px solid var(--gold);text-align:left;white-space:normal;
  font-size:12px;line-height:1.65;padding:9px 10px}
tr.xrow .dl{margin:0 0 2px}
tr.xrow .dl b{color:var(--ink)}
tr.xrow .k{color:var(--gray);font-weight:700;margin-right:4px}

.vcnt{font-size:10px;color:#94897b;font-weight:700}
#dcard{position:fixed;z-index:70;max-width:420px;background:#fff;border:1px solid var(--line-2);
  box-shadow:0 10px 28px rgba(30,20,10,.16);padding:10px 12px;font-size:12px;line-height:1.65}
#dcard[hidden]{display:none}
.code{font-family:Georgia,serif;font-weight:700;font-size:14px;color:#8f0d25}
.up{color:var(--up)} .down{color:var(--down)} .na{color:var(--gray)}
.stars{color:var(--gold);letter-spacing:.5px}
.ms-na{color:var(--gray)}
.pick{width:15px;height:15px;accent-color:var(--red);cursor:pointer;margin:0;vertical-align:middle}
.pick[disabled]{cursor:default;accent-color:var(--gray)}
td.cell-pick{text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:90;background:#2c2722;color:#fff7ee;
  font-size:12.5px;font-weight:700;padding:8px 14px;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.loading{padding:26px 4px;color:var(--gray);font-size:13px}
/* 手機：全屏抽屜 */
@media (max-width:768px){
  /* 不用全屏抽屜：抽屜會蓋住 .bar（toggle）→ 收不起來，也蓋住結果表 → 無法勾選加入組合。
     維持內聯展開，配合預設收合，就不會一開就淹掉畫面。 */
  .stage{border-left:0;border-right:0}
  .groups{grid-template-columns:1fr}
  .g{padding:4px 0}
  table{font-size:10px}
  th,td{padding:6px 3px}
  #tbl th{font-size:9px}
  .code{font-size:12px}
  .res{overflow-x:auto}
  /* ⚠️ 手機 .bar 一行放不下 toggle+hit+reset+.sums；.sums 曾被壓成 2px 寬 →
     摘要 chip 被撐成 51x58 的窄高方塊上下疊住。讓它自己佔一整行。 */
  .sums{order:9;flex:1 1 100%}
  .pane{max-height:calc(100vh - 20px);overflow:auto}
  .foot{gap:6px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">AIA · TMP2 / SMART PICKER（試用版）</p>
    <h1>智選基金</h1>
    <p class="sub">依 <b>類型／地區／風險／晨星評級／派息日／上架時間／回報／波動率</b> 等條件篩出基金；波動率與月榜同口徑（日報酬母體標準差 × √252，只對非派息基金有效）。<br>條件會自動記在本機。<a href="./06-fund-portfolio-workbench.html">← 回 06 基金組合</a></p>
  </header>

  <div class="stage">
    <div class="bar">
      <button class="toggle" id="toggle" aria-expanded="false"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.7V8.2l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>智能條件<span class="caret">▸</span></button>
      <div class="sums" id="sums"></div>
      <span class="hit" id="hit">—</span>
      <button class="reset" id="reset">重置</button>
    </div>
    <div class="panel" id="panel" hidden>
      <div class="loading" id="loading">載入資料中…（首次需載入約 8 MB 歷史資料）</div>
      <div id="body" hidden>
        <div class="presets" id="presets"></div>
        <div class="groups" id="groups"></div>
      </div>
    </div>
    <div class="foot">
      <button class="btn k" id="viewRes"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.4 10.4 L14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>查看結果</button>
      <button class="btn gold" id="savePreset"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>收藏</button>
      <button class="btn" id="myFav"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="currentColor"/></svg>我的收藏</button>
      <button class="btn k" id="addTo06" data-add="1" disabled>加入組合</button>
      <span class="hint" id="footHint"></span>
    </div>
  </div>

  <section class="res" id="res" hidden>
    <div id="resHead" style="margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"></div>
    <div style="overflow-x:auto"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  </section>
</div>
<div class="pane" id="pane" hidden></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  /* 錯誤可視化：試用版要能看到哪裡掛了，而不是白畫面 */
  function fail(msg){ var e=document.getElementById('loading'); if(e){ e.textContent='載入失敗：'+msg; e.style.color='#8f0d25'; }
    var w=document.getElementById('sp-wrap'); if(w) w.style.visibility='';
    document.title='ERR '+msg; }
  window.onerror=function(m,src,ln,col){ fail(m+' @'+(ln||'?')+':'+(col||'?')); };
  window.addEventListener('unhandledrejection', function(ev){ fail(String(ev.reason&&ev.reason.message||ev.reason)); });
  function step(t){ var e=document.getElementById('loading'); if(e) e.textContent=t; }
  var V = new Date().toISOString().slice(0,10).replace(/-/g,'');
  var BASE = './';
  var LS_KEY = 'calculator-hub-smart-picker-v1';
  var LS_PRESET = 'calculator-hub-smart-picker-presets-v1';
  var D = {};                                  // 資料
  var CATS = {type:[], region:[]};             // 由 assetClass 拆出
  var S = {                                    // 條件狀態（未選＝不限）
    type:[], region:[], risk:[], ccy:[], rate:[], nav:[], payday:[], dist:[], years:null,
    ret:{}, navP:{}, vol:{},          // 多期 AND：{期: {min,max}}，期＝YTD/3M/1Y/3Y/5Y
    yieldMin:null, yieldMax:null,
    houses:[], listYears:null, sort:'1Y', dir:-1
  };
  var PICK = [];                               // 勾選待加入的基金代號
  var RES_SHOWN = false;                       // 結果清單預設折疊，互動後才顯示
  var el = function(t,c,h){ var e=document.createElement(t); if(c) e.className=c; if(h!==undefined) e.innerHTML=h; return e; };
  var $ = function(id){ return document.getElementById(id); };
  function toast(t){ var x=$('toast'); x.textContent=t; x.classList.add('on'); setTimeout(function(){x.classList.remove('on');},1900); }

  /* ---------- 載入資料（runtime 版號破快取） ---------- */
  function loadScript(name){
    return new Promise(function(res,rej){
      var s=document.createElement('script');
      s.src = BASE+'data/'+name+'.js?v='+V;
      s.onload=res; s.onerror=function(){ res(); };   // 缺檔不致命
      document.head.appendChild(s);
    });
  }
  function fd(key){ return (window.__FUND_DATA__||{})['data/'+key+'.js']; }
  async function boot(){
    step('載入基本資料…');
    for (var f of ['catalog','smart-vol','distribution-references','manifest']) await loadScript(f);
    D.cat = fd('catalog')||{}; D.vol = fd('smart-vol')||{funds:{}};
    D.dref = fd('distribution-references')||{}; D.man = fd('manifest')||{};
    step('載入歷史指標（約 8 MB，首次較久）…');
    await loadScript('smart-metrics');
    D.sm = fd('smart-metrics')||{};
    step('建立索引…');
    buildMeta(); restore();
    step('渲染面板…');
    render(); $('loading').hidden=true; $('body').hidden=false;
    step('');
    renderPickBtn();
    syncStage();
    run();
    /* 防止載入期間露出半成品（注入到 06 時外層是 visibility:hidden） */
    var w=document.getElementById('sp-wrap'); if(w) w.style.visibility='';
  }

  /* ---------- 由 assetClass 拆「類型／地區」 ---------- */
  function splitClass(a){
    a = (a||'').trim();
    if (a.indexOf(' - ') > 0){ var p=a.split(' - '); return [p[0].trim(), p.slice(1).join(' - ').trim()]; }
    if (a.indexOf('/') > 0){ var q=a.split('/'); return [q[q.length-1].trim(), '環球']; }
    return [a||'其他','環球'];
  }
  var TYPE_ORDER = ['股票','多元資產','固定收入','貨幣市場'];
  var REGION_ORDER = ['環球','亞太區','中國及香港','美國','歐洲','新興市場','行業'];
  function orderBy(list, pref){
    var out = pref.filter(function(x){ return list.indexOf(x) >= 0; });
    list.forEach(function(x){ if (out.indexOf(x) < 0) out.push(x); });
    return out;
  }
  function buildMeta(){
    var funds = D.cat.funds||[];
    var tset={}, rset={};
    funds.forEach(function(f){ var s=splitClass(f.assetClass); f._type=s[0]; f._region=s[1]; tset[s[0]]=1; rset[s[1]]=1; });
    CATS.type = orderBy(Object.keys(tset), TYPE_ORDER);
    CATS.region = orderBy(Object.keys(rset), REGION_ORDER);
    D.byCode = {}; funds.forEach(function(f){ D.byCode[f.code]=f; });
  }

  /* ---------- 指標取值 ---------- */
  var PERIODS = ['YTD','3M','1Y','3Y','5Y'];
  var PLAB = { YTD:'年初至今', '3M':'3 個月', '1Y':'1 年', '3Y':'3 年', '5Y':'5 年' };
  function rowOf(code){
    var arr = (D.sm && D.sm.default) || [];
    return arr.find(function(x){ return x.code === code; }) || null;
  }
  function mOf(code, per){                     // 該期的回報／NAV 分位（performancePeriods 五期齊全）
    var row = rowOf(code); if(!row) return {};
    return ((row.performancePeriods||{})[per]) || (row.periods||{})[per] || {};
  }
  function volPair(code, per){                 // 該期 [年化波動率%, 最大回撤%]（A：派息基金＝Z 開頭不給）
    if (isDist(code)) return null;
    var r = (D.vol.funds||{})[code]; if(!r) return null;
    return r[per] || null;
  }
  function volOf(code, per){ var h=volPair(code,per); return h ? h[0] : null; }
  function mddOf(code, per){ var h=volPair(code,per); return h ? h[1] : null; }
  /* 派息基金＝代號 Z 開頭（與 06 bundle 的判據 Ho() 一致；用戶明確：只有 Z 開頭才是派息基金） */
  function isDist(code){ return /^Z/i.test(String(code||'').trim()); }
  function yieldOf(code){ if(!isDist(code)) return null; var r=D.dref[code]; return r && r.annualizedDistributionRate!=null ? r.annualizedDistributionRate : null; }
  function q(v, rq){                            // 單一期間條件的比對（min/max 皆可為 null）
    if(!rq || (rq.min==null && rq.max==null)) return true;
    if(v==null) return false;
    if(rq.min!=null && v < rq.min) return false;
    if(rq.max!=null && v > rq.max) return false;
    return true;
  }
  function listYearsOf(code){
    var idx=(D.man.navIndex||{})[code]; if(!idx||!idx.firstTimestamp) return null;
    return (Date.now()-idx.firstTimestamp)/31557600000;   // 365.25 天
  }
  function paydayOf(code){ if(!isDist(code)) return null; var r=D.dref[code]; return r? r.payDayBucket : null; }

  /* ---------- 篩選 ---------- */
  function match(f){
    var m = function(sel, v){ return sel.length===0 || sel.indexOf(v)>=0; };
    if (!m(S.type, f._type)) return false;
    if (!m(S.region, f._region)) return false;
    if (!m(S.dist, isDist(f.code) ? 'dist' : 'nondist')) return false;
    if (!m(S.risk, f.risk||'中')) return false;
    if (!m(S.ccy, f.currencyCode||'')) return false;
    if (!m(S.rate, String(f.rating||0))) return false;
    if (S.listYears!=null){ var ly=listYearsOf(f.code); if (ly==null || ly < S.listYears) return false; }
    if (!m(S.payday, paydayOf(f.code)||'')) return false;
    if (S.houses.length && S.houses.indexOf(f.house||'')<0) return false;
    /* 期間類條件：每一期各自判斷，期與期之間「且」（AND） */
    for (var pi=0; pi<PERIODS.length; pi++){
      var per = PERIODS[pi];
      var needR = S.ret[per], needN = S.navP[per], needV = S.vol[per];
      if (needR || needN){
        var m0 = mOf(f.code, per);
        if (needR && !q(m0.returnPercent, needR)) return false;
        if (needN && !q(m0.navPercentile, needN)) return false;
      }
      if (needV && !q(volOf(f.code, per), needV)) return false;
    }
    if (S.yieldMin!=null || S.yieldMax!=null){
      var y = yieldOf(f.code); if (y==null) return false;
      if (S.yieldMin!=null && y < S.yieldMin) return false;

    if(rows.length > lim){
      var mb=el('button','btn','顯示全部 '+rows.length+' 檔');
      mb.style.marginTop='8px';
      mb.onclick=function(){ SHOW_ALL=true; run(); };
      var trM=el('tr'), tdM=el('td',''); tdM.colSpan=C.length+1; tdM.appendChild(mb); trM.appendChild(tdM); tb.appendChild(trM);
    }
    document.getElementById('resHead').innerHTML =
      '<span class="vcnt">共 '+rows.length+' 檔'+((rows.length>lim)?('（先列 '+lim+'，可顯示全部）'):'')
      + '｜點列可展開完整資料（波動率／最大回撤在展開列）｜派息率只對派息基金（Z 開頭）</span>'
      + '<button class="btn k addbtn" data-add="1" disabled>加入組合</button>';
    $('res').hidden = !RES_SHOWN || $('panel').hidden;   /* 面板收合時，基金表也一起收 */
  }
  function pct(v){ return v==null?'—':((v>=0?'+':'')+v.toFixed(1)+'%'); }
  function cls(v){ return v==null?'na':(v>=0?'up':'down'); }
  /* 06 目前組合裡的代號 —— 06 組合表用的是 .fund-code（在 .fund-info-table 內），
     不是 .code（那是我們自己的 class）；也要排除搜尋建議清單。 */
  function portfolioCodes(){
    var out=[];
    Array.prototype.forEach.call(document.querySelectorAll('.fund-code'), function(e){
      if (e.closest && e.closest('#sp-wrap')) return;            /* 排除自家表格 */
      if (e.closest && e.closest('.fund-suggestions')) return;   /* 排除搜尋建議 */
      var t=(e.textContent||'').trim().toUpperCase();
      if (/^[A-Z0-9]{2,6}$/.test(t) && out.indexOf(t)<0) out.push(t);
    });
    return out;
  }
  function renderPickBtn(){
    var btns=document.querySelectorAll('[data-add]');
    for (var i=0;i<btns.length;i++){
      btns[i].disabled = !PICK.length;
      btns[i].textContent = PICK.length ? ('加入組合（'+PICK.length+'）') : '加入組合';
    }
  }
  /* 勾選 → 一鍵把代號送進 06 的「搜尋並加入基金」（用原生 setter 觸發 React） */
  function addTo06(){
    if (!PICK.length) return;
    var inp = document.querySelector('.add-fund-row input') || document.getElementById('fund-search');
    if (!inp){ toast('找不到 06 的加入基金欄位'); return; }
    var have = portfolioCodes();
    var room = Math.max(0, 10 - have.length);
    var todo = PICK.filter(function(c){ return have.indexOf(String(c).toUpperCase())<0; });
    if (!todo.length){ toast('所選基金都已在組合中'); return; }
    if (todo.length > room){
      if (!room){ toast('組合已滿（最多 10 隻）'); return; }
      toast('組合最多 10 隻，本次只加入前 '+room+' 隻');
      todo = todo.slice(0, room);
    }
    renderPickBtn(); Array.prototype.forEach.call(document.querySelectorAll('[data-add]'), function(b){ b.disabled=true; });
    var setter=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
    var i=0, added=[], miss=[];
    function finish(){
      var msg = added.length ? ('已加入 '+added.length+' 隻到 06 組合：'+added.join(' ')) : '沒有加入任何基金';
      if (miss.length) msg += '；找不到：'+miss.join(' ');
      toast(msg);
      PICK = PICK.filter(function(c){ return added.indexOf(c)<0; });
      RES_SHOWN = true; run();
    }
    function next(){
      if (i >= todo.length){ finish(); return; }
      var code = todo[i++];
      setter.call(inp, code);
      inp.dispatchEvent(new Event('input', {bubbles:true}));
      var tries = 0;
      (function waitSug(){
        var sg = document.querySelector('.fund-suggestions'), target=null;
        if (sg){
          var bs = sg.querySelectorAll('button');
          for (var k=0;k<bs.length;k++){
            if ((bs[k].innerText||'').trim().toUpperCase().indexOf(code.toUpperCase()) === 0){ target=bs[k]; break; }
          }
        }
        if (target){
          target.click(); added.push(code);
          setter.call(inp,''); inp.dispatchEvent(new Event('input', {bubbles:true}));
          setTimeout(next, 280);
        } else if (tries++ < 24){
          setTimeout(waitSug, 120);
        } else { miss.push(code); next(); }
      })();
    }
    next();
  }

  /* ---------- 本機記憶 ---------- */
  function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
  function restore(){ try{ var v=JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(v) Object.assign(S, v); }catch(e){} }

  /* ---------- 事件 ---------- */
  /* 用 panel 反查 .stage，避免抓到別的元素 */
  function syncStage(){ var st=$('panel').closest('.stage'); if(st) st.classList.toggle('open', !$('panel').hidden); }
  $('toggle').onclick=function(){
    var p=$('panel'); p.hidden=!p.hidden;
    syncStage();
    this.setAttribute('aria-expanded', String(!p.hidden));
    this.querySelector('.caret').textContent = p.hidden?'▸':'▾';
    if (p.hidden){
      $('res').hidden = true;                    /* ① 折疊智能條件 → 基金表一起收 */
    } else if (!RES_SHOWN){
      RES_SHOWN=true; run();                     /* 展開＝開始使用 */
    } else {
      $('res').hidden = false;
    }
  };
  $('reset').onclick=function(){
    Object.keys(S).forEach(function(k){ if(Array.isArray(S[k])) S[k]=[]; });
    S.ret={}; S.navP={}; S.vol={}; S.houses=[];
    S.yieldMin=S.yieldMax=null; S.listYears=null;
    render(); save(); run(); toast('已重置');
  };
  function favs(){ try{ return JSON.parse(localStorage.getItem(LS_PRESET)||'[]'); }catch(e){ return []; } }
  function setFavs(a){ try{ localStorage.setItem(LS_PRESET, JSON.stringify(a)); }catch(e){} }
  $('savePreset').onclick=function(){
    var name=prompt('收藏名稱？','方案 '+(new Date().toLocaleDateString('zh-HK')));
    if(!name) return;
    var a=favs(); a.push({name:name, s:JSON.parse(JSON.stringify(S)), at:Date.now()}); setFavs(a);
    toast('已收藏：'+name+'（按「我的收藏」可取回）');
  };
  $('myFav').onclick=function(){ openPane('favs', this); };
  panes.favs=function(p){
    p.appendChild(el('h4','','我的收藏（存在本機）'));
    var a=favs();
    if(!a.length){ p.appendChild(el('div','hint','尚無收藏。設好條件後按「收藏」即可存入。')); return; }
    var scr=el('div','scrl');
    a.forEach(function(it, idx){
      var r=el('div','row fav');
      r.appendChild(el('span','favname', it.name+'<em>'+(new Date(it.at).toLocaleDateString('zh-HK'))+'</em>'));
      var ap=el('button','chip','取回');
      ap.onclick=function(ev){ ev.stopPropagation(); S=JSON.parse(JSON.stringify(it.s)); save(); render(); run(); closePane(); toast('已取回：'+it.name); };
      var del=el('button','chip','刪除');
      del.onclick=function(ev){ ev.stopPropagation(); var b=favs(); b.splice(idx,1); setFavs(b); openPane('favs', null); toast('已刪除'); };
      r.appendChild(ap); r.appendChild(del); scr.appendChild(r);
    });
    p.appendChild(scr);
  };
  $('viewRes').onclick=function(){ var p=$('panel'); if(!p.hidden) $('toggle').click();
    RES_SHOWN=true; run(); $('res').scrollIntoView({behavior:'smooth'}); };
  $('addTo06').onclick=addTo06;
  /* 結果表頭那顆用事件委派（它每次 run() 都重建） */
  var _rh=$('resHead');
  if (_rh) _rh.addEventListener('click', function(e){
    var t=e.target && e.target.closest ? e.target.closest('[data-add]') : null;
    if (t) addTo06();
  });
  $('footHint').textContent='條件自動存本機｜'+new Date().toLocaleDateString('zh-HK');

  boot();
})();
</script>
</body>
</html>
